name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GBDK-2020
        run: tools/get-gbdk.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python tools
        run: pip install -r requirements-dev.txt

      - name: Build the ROM
        run: make

      - name: Check the committed web ROM is up to date
        run: cmp build/pandajump.gb web/pandajump.gb

      - name: Run the tests
        run: make test

      - uses: actions/upload-artifact@v4
        with:
          name: pandajump-rom
          path: |
            build/pandajump.gb
            build/pandajump.sym
