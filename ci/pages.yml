# Publishes web/ (the browser player and the ROM) to GitHub Pages.
# Enable it once in the repository: Settings > Pages > Source: GitHub Actions.
name: Deploy web player

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GBDK-2020
        run: tools/get-gbdk.sh

      - name: Build the ROM into web/
        run: make web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
